
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bot Configuration Manager - {{bot_id}}</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }
        
        .header p {
            opacity: 0.9;
            font-size: 14px;
        }
        
        .content {
            padding: 30px;
        }
        
        .actions {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        
        button {
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .btn-primary {
            background: #667eea;
            color: white;
        }
        
        .btn-primary:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        
        .btn-success {
            background: #48bb78;
            color: white;
        }
        
        .btn-success:hover {
            background: #38a169;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(72, 187, 120, 0.4);
        }
        
        .btn-secondary {
            background: #718096;
            color: white;
        }
        
        .btn-secondary:hover {
            background: #4a5568;
        }
        
        #editor {
            width: 100%;
            min-height: 600px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            padding: 20px;
            font-family: 'Monaco', 'Menlo', 'Courier New', monospace;
            font-size: 13px;
            line-height: 1.6;
            resize: vertical;
            background: #f7fafc;
        }
        
        #editor:focus {
            outline: none;
            border-color: #667eea;
            background: white;
        }
        
        .message {
            padding: 15px 20px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
            animation: slideIn 0.3s ease;
        }
        
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .message.success {
            background: #c6f6d5;
            color: #22543d;
            border-left: 4px solid #48bb78;
        }
        
        .message.error {
            background: #fed7d7;
            color: #742a2a;
            border-left: 4px solid #f56565;
        }
        
        .message.info {
            background: #bee3f8;
            color: #2c5282;
            border-left: 4px solid #4299e1;
        }
        
        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }
        
        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .status {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
            margin-left: 10px;
        }
        
        .status.loaded {
            background: #c6f6d5;
            color: #22543d;
        }
        
        .status.modified {
            background: #feebc8;
            color: #7c2d12;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🤖 Bot Configuration Manager</h1>
            <p>Bot ID: <strong>{{bot_id}}</strong> <span id="status" class="status"></span></p>
        </div>
        
        <div class="content">
            <div id="message" class="message"></div>
            <div id="loading" class="loading">
                <div class="spinner"></div>
                <p style="margin-top: 10px; color: #718096;">Loading configuration...</p>
            </div>
            
            <div class="actions">
                <button class="btn-primary" onclick="loadConfig()">📥 Load Configuration</button>
                <button class="btn-success" onclick="saveConfig()">💾 Save Configuration</button>
                <button class="btn-secondary" onclick="formatJSON()">✨ Format JSON</button>
                <button class="btn-secondary" onclick="validateJSON()">✓ Validate JSON</button>
            </div>
            
            <textarea id="editor" placeholder="Click 'Load Configuration' to fetch the current configuration..."></textarea>
        </div>
    </div>

    <script>
        const botId = '{{bot_id}}';
        let originalConfig = null;
        
        // Show message
        function showMessage(text, type) {
            const messageEl = document.getElementById('message');
            messageEl.textContent = text;
            messageEl.className = `message ${type}`;
            messageEl.style.display = 'block';
            setTimeout(() => {
                messageEl.style.display = 'none';
            }, 5000);
        }
        
        // Show/hide loading
        function setLoading(isLoading) {
            document.getElementById('loading').style.display = isLoading ? 'block' : 'none';
        }
        
        // Update status
        function updateStatus(status) {
            const statusEl = document.getElementById('status');
            if (status === 'loaded') {
                statusEl.textContent = 'Loaded';
                statusEl.className = 'status loaded';
            } else if (status === 'modified') {
                statusEl.textContent = 'Modified';
                statusEl.className = 'status modified';
            } else {
                statusEl.textContent = '';
                statusEl.className = 'status';
            }
        }
        
        // Load configuration
        async function loadConfig() {
            setLoading(true);
            try {
                const response = await fetch(`/api/v1/bot_hub/${botId}/config`);
                if (!response.ok) {
                    const response_status = response.status
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                const config = await response.json();
                originalConfig = JSON.stringify(config, null, 2);
                document.getElementById('editor').value = originalConfig;
                showMessage('Configuration loaded successfully!', 'success');
                updateStatus('loaded');
            } catch (error) {
                const error_message = error.message;
                showMessage(`Error loading configuration: ${error.message}`, 'error');
                console.error('Error:', error);
            } finally {
                setLoading(false);
            }
        }
        
        // Save configuration
        async function saveConfig() {
            const editor = document.getElementById('editor');
            const configText = editor.value;
            
            if (!configText.trim()) {
                showMessage('Editor is empty! Please load or enter a configuration first.', 'error');
                return;
            }
            
            try {
                const config = JSON.parse(configText);
                setLoading(true);
                
                const response = await fetch(`/api/v1/bot_hub/${botId}/config`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(config)
                });
                
                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.detail || `HTTP error! status: ${response.status}`);
                }
                
                const result = await response.json();
                originalConfig = configText;
                showMessage('Configuration saved successfully!', 'success');
                updateStatus('loaded');
            } catch (error) {
                if (error instanceof SyntaxError) {
                    showMessage('Invalid JSON! Please check your syntax.', 'error');
                } else {
                    showMessage(`Error saving configuration: ${error.message}`, 'error');
                }
                console.error('Error:', error);
            } finally {
                setLoading(false);
            }
        }
        
        // Format JSON
        function formatJSON() {
            const editor = document.getElementById('editor');
            try {
                const config = JSON.parse(editor.value);
                editor.value = JSON.stringify(config, null, 2);
                showMessage('JSON formatted successfully!', 'success');
            } catch (error) {
                showMessage('Invalid JSON! Cannot format.', 'error');
            }
        }
        
        // Validate JSON
        function validateJSON() {
            const editor = document.getElementById('editor');
            try {
                JSON.parse(editor.value);
                showMessage('✓ JSON is valid!', 'success');
            } catch (error) {
                showMessage(`Invalid JSON: ${error.message}`, 'error');
            }
        }
        
        // Track changes
        document.getElementById('editor').addEventListener('input', function() {
            if (originalConfig && this.value !== originalConfig) {
                updateStatus('modified');
            } else if (originalConfig) {
                updateStatus('loaded');
            }
        });
        
        // Auto-load on page load
        window.addEventListener('load', function() {
            loadConfig();
        });
        
        // Keyboard shortcuts
        document.addEventListener('keydown', function(e) {
            if ((e.ctrlKey || e.metaKey) && e.key === 's') {
                e.preventDefault();
                saveConfig();
            }
            if ((e.ctrlKey || e.metaKey) && e.key === 'l') {
                e.preventDefault();
                loadConfig();
            }
        });
    </script>
</body>
</html>
