<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Function Manager</title>
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            body {
                font-family:
                    -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                    Oxygen, Ubuntu, Cantarell, sans-serif;
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                min-height: 100vh;
                padding: 20px;
            }

            .container {
                max-width: 1400px;
                margin: 0 auto;
                background: white;
                border-radius: 12px;
                box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
                overflow: hidden;
            }

            .header {
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                color: white;
                padding: 30px;
            }

            .header h1 {
                font-size: 28px;
                margin-bottom: 8px;
            }

            .header p {
                opacity: 0.9;
                font-size: 14px;
            }

            .content {
                padding: 30px;
            }

            .table-container {
                overflow-x: auto;
                border: 1px solid #e2e8f0;
                border-radius: 8px;
            }

            table {
                width: 100%;
                border-collapse: collapse;
            }

            thead {
                background: #f7fafc;
            }

            th {
                text-align: left;
                padding: 16px;
                font-weight: 600;
                color: #2d3748;
                border-bottom: 2px solid #e2e8f0;
                font-size: 14px;
                text-transform: uppercase;
                letter-spacing: 0.5px;
            }

            td {
                padding: 16px;
                border-bottom: 1px solid #e2e8f0;
                color: #4a5568;
            }

            tbody tr:hover {
                background: #f7fafc;
            }

            .schema-cell {
                max-width: 400px;
            }

            .schema-preview {
                background: #f7fafc;
                padding: 12px;
                border-radius: 6px;
                font-family: "Courier New", monospace;
                font-size: 12px;
                overflow-x: auto;
                white-space: pre-wrap;
                word-break: break-all;
            }

            .btn {
                padding: 8px 16px;
                border: none;
                border-radius: 6px;
                cursor: pointer;
                font-size: 14px;
                font-weight: 500;
                transition: all 0.2s;
                margin-right: 8px;
            }

            .btn-edit {
                background: #4299e1;
                color: white;
            }

            .btn-edit:hover {
                background: #3182ce;
                transform: translateY(-1px);
            }

            .btn-delete {
                background: #f56565;
                color: white;
            }

            .btn-delete:hover {
                background: #e53e3e;
                transform: translateY(-1px);
            }

            .btn-create {
                background: #48bb78;
                color: white;
                padding: 12px 24px;
                margin-bottom: 20px;
            }

            .btn-create:hover {
                background: #38a169;
            }

            .modal {
                display: none;
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: rgba(0, 0, 0, 0.6);
                z-index: 1000;
                animation: fadeIn 0.2s;
            }

            @keyframes fadeIn {
                from {
                    opacity: 0;
                }
                to {
                    opacity: 1;
                }
            }

            .modal-content {
                position: relative;
                background: white;
                max-width: 700px;
                margin: 50px auto;
                border-radius: 12px;
                box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
                max-height: 80vh;
                overflow-y: auto;
                animation: slideIn 0.3s;
            }

            .modal.active {
                display: flex;
            }

            @keyframes slideIn {
                from {
                    transform: translateY(-50px);
                    opacity: 0;
                }
                to {
                    transform: translateY(0);
                    opacity: 1;
                }
            }

            .modal-header {
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                color: white;
                padding: 24px 30px;
                border-radius: 12px 12px 0 0;
            }

            .modal-header h2 {
                font-size: 22px;
            }

            .modal-close {
                background: none;
                border: none;
                font-size: 28px;
                color: #6b7280;
                cursor: pointer;
                line-height: 1;
                padding: 0;
                width: 30px;
                height: 30px;
            }

            .modal-close:hover {
                color: #111827;
            }

            .form-group {
                padding: 24px;
            }

            .form-group label {
                display: block;
                margin-bottom: 8px;
                font-weight: 500;
                color: #374151;
            }

            .form-group input {
                width: 100%;
                padding: 10px 12px;
                border: 1px solid #d1d5db;
                border-radius: 8px;
                font-size: 14px;
                box-sizing: border-box;
            }

            .form-group input:focus {
                outline: none;
                border-color: #2563eb;
                box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
            }

            .form-group select {
                width: 100%;
                padding: 10px 12px;
                border: 1px solid #d1d5db;
                border-radius: 8px;
                font-size: 14px;
                box-sizing: border-box;
                background-color: white;
                cursor: pointer;
            }

            .form-group select:focus {
                outline: none;
                border-color: #2563eb;
                box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
            }

            .modal-body {
                padding: 30px;
            }

            .pre-say-item {
                display: flex;
                gap: 12px;
                margin-bottom: 16px;
                align-items: center;
            }

            .pre-say-item input,
            .pre-say-item select {
                flex: 1;
                padding: 10px 14px;
                border: 2px solid #e2e8f0;
                border-radius: 6px;
                font-size: 14px;
                transition: border-color 0.2s;
            }

            .pre-say-item input:focus {
                outline: none;
                border-color: #667eea;
            }
            .pre-say-values {
                display: flex;
                flex-direction: column;
                gap: 8px;
                width: 100%;
            }

            .pre-say-values button {
                align-self: flex-start;
            }

            .pre-say-value-row {
                display: flex;
                gap: 8px;
                align-items: center;
            }

            .pre-say-value-row input,
            .pre-say-value-row select {
                flex: 1;
            }

            .value-toolbar {
                display: flex;
                gap: 8px;
                margin-top: 12px;
            }
            .helper-text {
                font-size: 13px;
                color: #4a5568;
                margin-bottom: 12px;
            }
            .mapping-item {
                display: flex;
                gap: 12px;
                margin-bottom: 16px;
                align-items: center;
            }

            .label-item {
                flex: 1;
                padding: 10px 14px;
                border: 2px solid #e2e8f0;
                border-radius: 6px;
                font-size: 14px;
                transition: border-color 0.2s;
            }

            .mapping-item input {
                flex: 1;
                padding: 10px 14px;
                border: 2px solid #e2e8f0;
                border-radius: 6px;
                font-size: 14px;
                transition: border-color 0.2s;
            }

            .mapping-item input:focus {
                outline: none;
                border-color: #667eea;
            }

            .btn-remove {
                background: #fc8181;
                color: white;
                padding: 10px 16px;
                border: none;
                border-radius: 6px;
                cursor: pointer;
                font-size: 14px;
            }

            .btn-add {
                background: #68d391;
                color: white;
                padding: 10px 20px;
                border: none;
                border-radius: 6px;
                cursor: pointer;
                font-size: 14px;
                margin-top: 12px;
            }

            .create-func-btn {
                background-color: #10b981;
                color: white;
                border: none;
                padding: 10px 20px;
                border-radius: 8px;
                font-size: 16px;
                font-weight: 500;
                cursor: pointer;
                transition: background-color 0.2s;
                display: flex;
                align-items: center;
                gap: 8px;
            }

            .create-func-btn:hover {
                background-color: #059669;
            }

            .modal-footer {
                padding: 20px 30px;
                background: #f7fafc;
                display: flex;
                justify-content: flex-end;
                gap: 12px;
                border-radius: 0 0 12px 12px;
            }

            .btn-primary,
            .btn-secondary {
                padding: 10px 20px;
                border-radius: 8px;
                font-size: 14px;
                font-weight: 500;
                cursor: pointer;
                border: none;
                transition: all 0.2s;
            }

            .btn-primary {
                background: #2563eb;
                color: white;
            }

            .btn-primary:hover {
                background: #1d4ed8;
            }

            .btn-secondary {
                background: #f3f4f6;
                color: #374151;
            }

            .btn-secondary:hover {
                background: #e5e7eb;
            }

            .btn-cancel {
                background: #e2e8f0;
                color: #4a5568;
                padding: 10px 24px;
            }

            .btn-save {
                background: #667eea;
                color: white;
                padding: 10px 24px;
            }

            .btn-save:hover {
                background: #5a67d8;
            }

            .loading {
                text-align: center;
                padding: 40px;
                color: #718096;
            }

            .spinner {
                border: 3px solid #f3f3f3;
                border-top: 3px solid #667eea;
                border-radius: 50%;
                width: 40px;
                height: 40px;
                animation: spin 1s linear infinite;
                margin: 0 auto 16px;
            }

            @keyframes spin {
                0% {
                    transform: rotate(0deg);
                }
                100% {
                    transform: rotate(360deg);
                }
            }

            .error {
                background: #fed7d7;
                color: #c53030;
                padding: 16px;
                border-radius: 8px;
                margin-bottom: 20px;
            }

            .empty-state {
                text-align: center;
                padding: 60px 20px;
                color: #718096;
            }

            .empty-state svg {
                width: 80px;
                height: 80px;
                margin-bottom: 20px;
                opacity: 0.5;
            }
        </style>
    </head>
    <body>
        <div class="container">
            <div class="header">
                <h1>Function Manager</h1>
                <p id="pageInfo">Loading...</p>
                <div style="display: flex; gap: 10px">
                    <button class="create-func-btn" id="createFuncBtn">
                        <svg
                            width="20"
                            height="20"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                        >
                            <circle cx="12" cy="12" r="3"></circle>
                            <path
                                d="M12 1v6m0 6v6m8.66-15l-3 5.2M6.34 18.8l-3-5.2m15.32 5.2l-3-5.2M6.34 5.2l-3 5.2"
                            ></path>
                        </svg>
                        Add function
                    </button>
                </div>
            </div>

            <div class="content">
                <div id="errorContainer"></div>

                <div id="loadingState" class="loading">
                    <div class="spinner"></div>
                    <p>Loading functions...</p>
                </div>

                <div id="contentArea" style="display: none">
                    <div class="table-container">
                        <table>
                            <thead>
                                <tr>
                                    <th>Function ID</th>
                                    <th>Function Label</th>
                                    <th>Function Schema</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody id="functionsTable"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>

        <!-- Create Function Modal -->
        <div class="modal" id="createFuncModal">
            <div class="modal-content">
                <div class="modal-header">
                    <h2>Create New Function</h2>
                    <button class="modal-close" id="closeModal">&times;</button>
                </div>
                <form id="createFuncForm">
                    <div class="form-group">
                        <label for="funcNameInput">Function</label>
                        <select
                            id="funcNameInput"
                            required
                        >
                            <option value="">Loading functions...</option>
                        </select>
                    </div>
                    <div class="modal-footer">
                        <button
                            type="button"
                            class="btn-secondary"
                            id="cancelBtn"
                        >
                            Cancel
                        </button>
                        <button type="submit" class="btn-primary">
                            Create
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Edit Modal -->
        <div id="editModal" class="modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h2>Edit Function</h2>
                </div>
                <div class="modal-body">
                    <div id="schemaIdContainer"></div>
                </div>
                <div class="modal-body">
                    <div class="">
                        <label for="labelIdContainer" class="mapping-key"
                            >Function Label</label
                        >
                        <input
                            type="text"
                            id="labelIdContainer"
                            class="label-item"
                            placeholder="Enter func label"
                            required
                        />
                    </div>
                </div>
                <div class="modal-body">
                    <div class="">
                        <label for="ackDescriptionInput" class="mapping-key"
                            >Ack LLM Description</label
                        >
                        <textarea
                            id="ackDescriptionInput"
                            class="label-item"
                            rows="3"
                            placeholder="Enter acknowledgement description"
                        ></textarea>
                    </div>
                </div>
                <div class="modal-body">
                    <p class="helper-text">
                        Use a string or a JSON array (for example
                        <code>["hi","hello"]</code>) as the pre-say value per
                        language key.
                    </p>
                    <div id="preSayContainer"></div>
                    <button
                        type="button"
                        class="btn btn-add"
                        onclick="addPreSay()"
                    >
                        + Add Pre Say
                    </button>
                </div>
                <div class="modal-body">
                    <div id="mappingsContainer"></div>
                    <button
                        type="button"
                        class="btn btn-add"
                        onclick="addMapping()"
                    >
                        + Add Mapping
                    </button>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-cancel" onclick="closeModal()">
                        Cancel
                    </button>
                    <button class="btn btn-save" onclick="saveMappings()">
                        Save Changes
                    </button>
                </div>
            </div>
        </div>

        <script>
            const RAW_LANGUAGE_TEXT = `

Kalaallisut, Greenlandic	kl

Kazakh	kk

Kikuyu	ki
Kinyarwanda (Rwanda)	rw
Kirundi	rn
Kyrgyz	ky

Korean	ko

Kwanyama	kj
Lao	lo
Latin	la
Latvian (Lettish)	lv
Limburgish ( Limburger)	li
Lingala	ln
Lithuanian	lt
Luga-Katanga	lu
Luganda, Ganda	lg
Luxembourgish	lb
Manx	gv
Macedonian	mk
Malagasy	mg
Malay	ms
Malayalam	ml
Maltese	mt
Maori	mi
Marathi	mr
Marshallese	mh
Moldavian	mo
Mongolian	mn
Nauru	na
Navajo	nv
Ndonga	ng
Northern Ndebele	nd
Nepali	ne
Norwegian	no
Norwegian bokmål	nb
Norwegian nynorsk	nn
Nuosu	ii
Occitan	oc
Ojibwe	oj
Old Church Slavonic, Old Bulgarian	cu
Oriya	or
Oromo (Afaan Oromo)	om

Pāli	pi
Pashto, Pushto	ps
Persian (Farsi)	fa

Punjabi (Eastern)	pa
Quechua	qu
Romansh	rm

Russian	ru
Sami	se

Sango	sg
Sanskrit	sa
Serbian	sr
Serbo-Croatian	sh
Sesotho	st
Setswana	tn
Shona	sn
Sichuan Yi	ii
Sindhi	sd
Sinhalese	si
Siswati	ss
Slovak	sk

Southern Ndebele	nr
Spanish	es
Sundanese	su
Swahili (Kiswahili)	sw
Swati	ss
Swedish	sv
Tagalog	tl
Tahitian	ty
Tajik	tg
Tamil	ta
Tatar	tt
Telugu	te
Thai	th
Tibetan	bo
Tigrinya	ti
Tonga	to
Tsonga	ts
Turkish	tr
Turkmen	tk
Twi	tw
Uyghur	ug
Ukrainian	uk
Urdu	ur
Uzbek	uz
Venda	ve
Vietnamese	vi
Volapük	vo
Wallon	wa
Welsh	cy
Wolof	wo
Western Frisian	fy
Xhosa	xh
Yiddish	yi, ji
Yoruba	yo
Zhuang, Chuang	za
Zulu	zu
            `
                .trim()
                .split("\n")
                .map((line) => line.trim().split("\t"));
            const LANGUAGE_OPTIONS = [];
            const LANGUAGE_LOOKUP = {};
            {
                const seen = new Set();
                RAW_LANGUAGE_TEXT.forEach(([name, codes]) => {
                    const code = codes.split(",")[0].trim();
                    if (seen.has(code)) {
                        return;
                    }
                    seen.add(code);
                    LANGUAGE_OPTIONS.push({ name, code });
                    LANGUAGE_LOOKUP[code] = name;
                });
            }

            function createLanguageSelect(selectedCode = "") {
                const select = document.createElement("select");
                select.className = "mapping-key";

                const blankOption = document.createElement("option");
                blankOption.value = "";
                blankOption.textContent = "Select language";
                select.appendChild(blankOption);

                LANGUAGE_OPTIONS.forEach(({ name, code }) => {
                    const option = document.createElement("option");
                    option.value = code;
                    option.textContent = `${name} (${code})`;
                    if (code === selectedCode) {
                        option.selected = true;
                    }
                    select.appendChild(option);
                });

                if (selectedCode && !LANGUAGE_LOOKUP[selectedCode]) {
                    const customOption = document.createElement("option");
                    customOption.value = selectedCode;
                    customOption.textContent = `${selectedCode} (Custom)`;
                    customOption.selected = true;
                    select.appendChild(customOption);
                }

                return select;
            }

            let botId, nodeId;
            let currentFunctionId;
            let currentMappings = {};
            let currentPreSay = {};

            // Extract bot_id and node_id from URL
            function initializePage() {
                const pathParts = window.location.pathname.split("/");
                const botIndex = pathParts.indexOf("bot");
                const nodesIndex = pathParts.indexOf("nodes");

                if (botIndex !== -1 && nodesIndex !== -1) {
                    botId = pathParts[botIndex + 1];
                    nodeId = pathParts[nodesIndex + 1];
                    document.getElementById("pageInfo").textContent =
                        `Bot: ${botId} | Node: ${nodeId}`;
                    loadFunctions();
                } else {
                    showError(
                        "Invalid URL format. Expected: /bot/<bot_id>/nodes/<node_id>/functions",
                    );
                }
            }

            // Load functions from API
            async function loadFunctions() {
                try {
                    const response = await fetch(
                        `/api/v1/bot_hub/${botId}/nodes/${nodeId}`,
                    );

                    if (!response.ok) {
                        throw new Error(
                            `HTTP error! status: ${response.status}`,
                        );
                    }

                    const data = await response.json();
                    displayFunctions(data.functions || []);
                } catch (error) {
                    showError(`Failed to load functions: ${error.message}`);
                } finally {
                    const loadingState = document.getElementById("loadingState");
                    if (loadingState) {
                        loadingState.style.display = "none";
                    }
                }
            }

            // Display functions in table
            function displayFunctions(functions) {
                const contentArea = document.getElementById("contentArea");
                const tbody = document.getElementById("functionsTable");
                
                if (!contentArea) {
                    console.error("contentArea element not found");
                    return;
                }

                if (functions.length === 0) {
                    contentArea.innerHTML = `
                    <div class="empty-state">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0v5a2 2 0 01-2 2H6a2 2 0 01-2-2v-5m16 0h-2.586a1 1 0 00-.707.293l-2.414 2.414a1 1 0 01-.707.293h-3.172a1 1 0 01-.707-.293l-2.414-2.414A1 1 0 006.586 13H4" />
                        </svg>
                        <h3>No Functions Found</h3>
                        <p>There are no functions configured for this node.</p>
                    </div>
                `;
                    contentArea.style.display = "block";
                } else {
                    // Restore table structure if it was replaced by empty state
                    if (!tbody || !contentArea.querySelector(".table-container")) {
                        contentArea.innerHTML = `
                        <div class="table-container">
                            <table>
                                <thead>
                                    <tr>
                                        <th>Function ID</th>
                                        <th>Function Label</th>
                                        <th>Function Schema</th>
                                        <th>Actions</th>
                                    </tr>
                                </thead>
                                <tbody id="functionsTable"></tbody>
                            </table>
                        </div>
                        `;
                    }
                    
                    const tbodyElement = document.getElementById("functionsTable");
                    if (!tbodyElement) {
                        console.error("functionsTable element not found");
                        return;
                    }
                    
                    tbodyElement.innerHTML = "";
                    contentArea.style.display = "block";

                    functions.forEach((func) => {
                        const ackDescriptionStr = JSON.stringify(
                            func.ack_llm_description != null
                                ? func.ack_llm_description
                                : "",
                        );
                        const row = document.createElement("tr");
                        row.innerHTML = `
                        <td><strong>${func.function_id}</strong></td>
                        <td class="schema-cell">
                            <div class="schema-preview">${JSON.stringify(func.function_label, null, 2)}</div>
                        </td>
                        <td class="schema-cell">
                            <div class="schema-preview">${JSON.stringify(func.function_schema, null, 2)}</div>
                        </td>
                        <td>
                            <button class="btn btn-edit" onclick='editMappings(${JSON.stringify(func.id)}, ${JSON.stringify(func.function_id)}, ${JSON.stringify(func.function_label)}, ${JSON.stringify(func.transition_mappings)}, ${JSON.stringify(func.pre_say)}, ${ackDescriptionStr})'>
                                Edit Function
                            </button>
                            <button class="btn btn-delete" onclick='deleteFunction("${func.id}")'>
                                Delete
                            </button>
                        </td>
                    `;
                        tbodyElement.appendChild(row);
                    });
                }
            }

            // Show error message
            function showError(message) {
                const errorContainer =
                    document.getElementById("errorContainer");
                errorContainer.innerHTML = `<div class="error">${message}</div>`;
                setTimeout(() => {
                    errorContainer.innerHTML = "";
                }, 5000);
            }

            // Edit mappings
            function editMappings(
                functionId,
                function_schema_id,
                function_label,
                mappings,
                pre_say,
                ack_llm_description,
            ) {
                currentFunctionId = functionId;
                currentMappings = mappings || {};
                currentPreSay = pre_say || {};

                const labelId = document.getElementById("labelIdContainer");
                console.log(function_label);
                labelId.value = function_label;
                const ackInput = document.getElementById("ackDescriptionInput");
                ackInput.value = ack_llm_description || "";
                const schemaId = document.getElementById("schemaIdContainer");
                console.log(function_schema_id);
                schemaId.textContent = function_schema_id;
                const preSayContainer =
                    document.getElementById("preSayContainer");
                preSayContainer.innerHTML = "";
                const container = document.getElementById("mappingsContainer");
                container.innerHTML = "";

                Object.entries(currentMappings).forEach(([key, value]) => {
                    addMappingRow(key, value);
                });

                Object.entries(currentPreSay).forEach(([key, value]) => {
                    addPreSayRow(key, value);
                });

                document.getElementById("editModal").style.display = "block";
            }

            // Add mapping row
            function addMappingRow(key = "", value = "") {
                const container = document.getElementById("mappingsContainer");
                const div = document.createElement("div");
                div.className = "mapping-item";

                const keyInput = document.createElement("input");
                keyInput.type = "text";
                keyInput.placeholder = "Key";
                keyInput.className = "mapping-key";
                keyInput.value = key || "";

                const valueInput = document.createElement("input");
                valueInput.type = "text";
                valueInput.placeholder = "Value";
                valueInput.className = "mapping-value";
                valueInput.value = value || "";

                const removeButton = document.createElement("button");
                removeButton.type = "button";
                removeButton.className = "btn-remove";
                removeButton.textContent = "Remove";
                removeButton.addEventListener("click", () => div.remove());

                div.appendChild(keyInput);
                div.appendChild(valueInput);
                div.appendChild(removeButton);
                container.appendChild(div);
            }

            function createPreSayValueRow(value = "") {
                const row = document.createElement("div");
                row.className = "pre-say-value-row";

                const input = document.createElement("input");
                input.type = "text";
                input.placeholder = "Value";
                input.className = "mapping-value pre-say-value";
                input.value = value || "";

                const removeButton = document.createElement("button");
                removeButton.type = "button";
                removeButton.className = "btn-remove";
                removeButton.textContent = "Remove";
                removeButton.addEventListener("click", () => row.remove());

                row.appendChild(input);
                row.appendChild(removeButton);
                return row;
            }

            // Add pre-say row
            function addPreSayRow(key = "", value = "") {
                const container = document.getElementById("preSayContainer");
                const div = document.createElement("div");
                div.className = "pre-say-item";

                const keySelect = createLanguageSelect(key);
                keySelect.classList.add("mapping-key");

                const removeRowButton = document.createElement("button");
                removeRowButton.type = "button";
                removeRowButton.className = "btn-remove";
                removeRowButton.textContent = "Remove Key";
                removeRowButton.addEventListener("click", () => div.remove());

                const header = document.createElement("div");
                header.className = "pre-say-value-row";
                header.appendChild(keySelect);
                header.appendChild(removeRowButton);

                const valuesContainer = document.createElement("div");
                valuesContainer.className = "pre-say-values";

                const valueList = Array.isArray(value)
                    ? value
                    : value != null && value !== ""
                      ? [value]
                      : [""];
                valueList.forEach((val) =>
                    valuesContainer.appendChild(createPreSayValueRow(val)),
                );

                const toolbar = document.createElement("div");
                toolbar.className = "value-toolbar";
                const addValueButton = document.createElement("button");
                addValueButton.type = "button";
                addValueButton.className = "btn btn-add";
                addValueButton.textContent = "+ Add Value";
                addValueButton.addEventListener("click", () =>
                    valuesContainer.appendChild(createPreSayValueRow()),
                );
                toolbar.appendChild(addValueButton);

                div.appendChild(header);
                div.appendChild(valuesContainer);
                div.appendChild(toolbar);
                container.appendChild(div);
            }

            // Add new mapping
            function addMapping() {
                addMappingRow();
            }

            // Add new mapping
            function addPreSay() {
                addPreSayRow();
            }

            // Close modal
            function closeModal() {
                document.getElementById("editModal").style.display = "none";
            }

            // Save mappings
            async function saveMappings() {
                const mappingItems = document.querySelectorAll(".mapping-item");
                const newMappings = {};
                const preSayItems = document.querySelectorAll(".pre-say-item");
                const newPreSays = {};

                const schemaId = document.getElementById("schemaIdContainer");
                const labelId = document.getElementById("labelIdContainer");
                const ackInput = document.getElementById("ackDescriptionInput");
                const function_schema_id = schemaId.textContent;
                const function_label = labelId.value;
                const ack_llm_description = ackInput.value.trim();

                mappingItems.forEach((item) => {
                    const key = item.querySelector(".mapping-key").value.trim();
                    const value = item
                        .querySelector(".mapping-value")
                        .value.trim();
                    if (key && value) {
                        newMappings[key] = value;
                    }
                });

                preSayItems.forEach((item) => {
                    const key = item.querySelector(".mapping-key").value.trim();
                    const values = Array.from(
                        item.querySelectorAll(".pre-say-value"),
                    )
                        .map((input) => input.value.trim())
                        .filter((value) => value);

                    if (!key || values.length === 0) {
                        return;
                    }

                    newPreSays[key] = values.length === 1 ? values[0] : values;
                });

                try {
                    const response = await fetch(
                        `/api/v1/bot_hub/${botId}/nodes/${nodeId}/function/${currentFunctionId}`,
                        {
                            method: "POST",
                            headers: {
                                "Content-Type": "application/json",
                            },
                            body: JSON.stringify({
                                function_id: function_schema_id,
                                function_label: function_label,
                                ack_llm_description:
                                    ack_llm_description || null,
                                transition_mappings: newMappings,
                                pre_say: newPreSays,
                            }),
                        },
                    );

                    if (!response.ok) {
                        throw new Error(
                            `HTTP error! status: ${response.status}`,
                        );
                    }

                    closeModal();
                    loadFunctions();
                } catch (error) {
                    showError(`Failed to update mappings: ${error.message}`);
                }
            }

            // Delete function
            async function deleteFunction(functionId) {
                if (
                    !confirm("Are you sure you want to delete this function?")
                ) {
                    return;
                }

                try {
                    const response = await fetch(
                        `/api/v1/bot_hub/${botId}/nodes/${nodeId}/function/${functionId}`,
                        {
                            method: "DELETE",
                        },
                    );

                    if (!response.ok) {
                        throw new Error(
                            `HTTP error! status: ${response.status}`,
                        );
                    }

                    loadFunctions();
                } catch (error) {
                    showError(`Failed to delete function: ${error.message}`);
                }
            }

            // Close modal when clicking outside
            window.onclick = function (event) {
                const modal = document.getElementById("editModal");
                if (event.target === modal) {
                    closeModal();
                }
            };

            // Create function modal

            const createFuncBtn = document.getElementById("createFuncBtn");
            const createFuncModal = document.getElementById("createFuncModal");
            const closeFuncModal = document.getElementById("closeModal");
            const cancelBtn = document.getElementById("cancelBtn");
            const createFuncForm = document.getElementById("createFuncForm");

            // Load available functions for dropdown
            async function loadAvailableFunctions() {
                const funcSelect = document.getElementById("funcNameInput");
                funcSelect.innerHTML = '<option value="">Loading functions...</option>';
                
                try {
                    const response = await fetch(
                        `/api/v1/bot_hub/${botId}/available_functions`,
                    );
                    
                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }
                    
                    const data = await response.json();
                    const functions = data.functions || [];
                    
                    funcSelect.innerHTML = '<option value="">Select a function</option>';
                    
                    if (functions.length === 0) {
                        funcSelect.innerHTML = '<option value="">No functions available</option>';
                        return;
                    }
                    
                    functions.forEach((func) => {
                        const option = document.createElement("option");
                        // Use id as the value (function_id), display name with description
                        const functionId = func.id || func.name;
                        const displayName = func.name || func.id;
                        option.value = functionId;
                        option.textContent = displayName;
                        if (func.description) {
                            option.title = `${displayName}: ${func.description}`;
                        }
                        funcSelect.appendChild(option);
                    });
                } catch (error) {
                    console.error("Failed to load functions:", error);
                    funcSelect.innerHTML = '<option value="">Error loading functions</option>';
                    showError(`Failed to load available functions: ${error.message}`);
                }
            }

            // Open modal
            createFuncBtn.addEventListener("click", async () => {
                console.log("create Function clicked");
                createFuncModal.classList.add("active");
                await loadAvailableFunctions();
                document.getElementById("funcNameInput").focus();
            });

            // Close modal
            const closeModalFunc = () => {
                createFuncModal.classList.remove("active");
                createFuncForm.reset();
            };

            closeFuncModal.addEventListener("click", closeModalFunc);
            cancelBtn.addEventListener("click", closeModalFunc);

            // Close on outside click
            createFuncModal.addEventListener("click", (e) => {
                if (e.target === createFuncModal) {
                    closeModalFunc();
                }
            });

            // Handle form submission
            createFuncForm.addEventListener("submit", (e) => {
                console.log("Form submitted");
                e.preventDefault();
                const functionId =
                    document.getElementById("funcNameInput").value;
                console.log("Creating Function:", functionId);

                // Your node creation logic here
                console.log("Creating function:", functionId);

                // Fetch nodes
                fetch(
                    `/api/v1/bot_hub/${botId}/nodes/${nodeId}/function`,
                    {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json",
                        },
                        body: JSON.stringify({
                            function_id: functionId,
                        }),
                    },
                )
                    .then((nodeResponse) => {
                        if (!nodeResponse.ok)
                            throw new Error("Failed to create Func");
                        return nodeResponse.json();
                    })
                    .then((nodesData) => {
                        console.log("Created node:", nodesData);
                        // Close modal after creation
                        closeModalFunc();
                        // Refresh the functions list
                        loadFunctions();
                    })
                    .catch((error) => {
                        showError(`Failed to create function: ${error.message}`);
                    });
            });

            // Initialize on page load
            initializePage();
        </script>
    </body>
</html>
