
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prompt Editor</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/theme/monokai.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/mode/markdown/markdown.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #1e1e1e;
            color: #fff;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        .header {
            background: #252525;
            padding: 16px 24px;
            border-bottom: 1px solid #333;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .header h1 {
            font-size: 18px;
            font-weight: 500;
        }
        
        .header-info {
            font-size: 12px;
            color: #888;
        }
        
        .actions {
            display: flex;
            gap: 12px;
        }
        
        button {
            padding: 8px 16px;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .btn-save {
            background: #0066cc;
            color: white;
        }
        
        .btn-save:hover:not(:disabled) {
            background: #0052a3;
        }
        
        .btn-save:disabled {
            background: #444;
            cursor: not-allowed;
            opacity: 0.5;
        }
        
        .btn-functions {
            background: #68ddbe;
            color: white;
        }
        .btn-functions:hover {
            background: #85c8dd;
        }
        
        .btn-reload {
            background: #444;
            color: white;
        }
        
        .btn-reload:hover {
            background: #555;
        }
        
        .editor-container {
            flex: 1;
            padding: 24px;
            overflow: auto;
        }
        
        .CodeMirror {
            height: 100%;
            font-size: 14px;
            border-radius: 4px;
            border: 1px solid #333;
        }
        
        .status {
            padding: 12px 24px;
            background: #252525;
            border-top: 1px solid #333;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .status.success {
            background: #1a4d1a;
            color: #4ade80;
        }
        
        .status.error {
            background: #4d1a1a;
            color: #f87171;
        }
        
        .status.loading {
            color: #60a5fa;
        }
        
        .spinner {
            width: 14px;
            height: 14px;
            border: 2px solid #333;
            border-top-color: #60a5fa;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="header">
        <div>
            <h1>Prompt Editor</h1>
            <div class="header-info">Node: <span id="nodeId">-</span> | Bot: <span id="botId">-</span></div>
        </div>
        <div class="actions">
            <button class="btn-reload" id="openFunctions">Functions</button>
            <button class="btn-reload" onclick="loadPrompt()">Reload</button>
            <button class="btn-save" id="saveBtn" onclick="savePrompt()">Save</button>
        </div>
    </div>
    
    <div class="editor-container">
        <textarea id="editor"></textarea>
    </div>
    
    <div class="status" id="status">
        <span id="statusText">Ready</span>
    </div>

    <script>
        let editor;
        let botId, nodeId;
        let originalContent = '';
        
        function init() {

            const pathParts = window.location.pathname.split('/');

            function getBotIdFromUrl() {
                const pathParts = window.location.pathname.split('/');
                console.log('Path parts:', pathParts);
                // const platformIndex = pathParts.indexOf('platform');
                const platformIndex = 1;
                if (platformIndex !== -1 && pathParts.length > platformIndex + 1) {
                    return pathParts[platformIndex + 1];
                }
                return null;
            }

            botId = getBotIdFromUrl();
            nodeId = pathParts[pathParts.indexOf('nodes') + 1];

            function handleFuncClick() {
                const url = `/bot/${botId}/nodes/${nodeId}/functions`;
                window.open(url, '_blank');
            }

            // Event listeners
            document.getElementById('openFunctions').addEventListener('click', handleFuncClick);
            
            
            document.getElementById('botId').textContent = botId;
            document.getElementById('nodeId').textContent = nodeId;
            
            editor = CodeMirror.fromTextArea(document.getElementById('editor'), {
                mode: 'markdown',
                theme: 'monokai',
                lineNumbers: true,
                lineWrapping: true,
                indentUnit: 2,
                tabSize: 2
            });
            
            editor.on('change', () => {
                const hasChanges = editor.getValue() !== originalContent;
                document.getElementById('saveBtn').disabled = !hasChanges;
            });
            
            loadPrompt();
        }
        
        function setStatus(message, type = 'info') {
            const statusEl = document.getElementById('status');
            const statusText = document.getElementById('statusText');
            
            statusEl.className = 'status ' + type;
            
            if (type === 'loading') {
                statusText.innerHTML = `<div class="spinner"></div> ${message}`;
            } else {
                statusText.textContent = message;
            }
            
            if (type === 'success' || type === 'error') {
                setTimeout(() => {
                    statusEl.className = 'status';
                    statusText.textContent = 'Ready';
                }, 3000);
            }
        }
        
        async function loadPrompt() {
            setStatus('Loading prompt...', 'loading');
            
            try {
                const response = await fetch(`/api/v1/bot_hub/${botId}/nodes/${nodeId}`);
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const data = await response.json();
                originalContent = data.prompt;
                editor.setValue(originalContent);
                document.getElementById('saveBtn').disabled = true;
                
                setStatus('Prompt loaded successfully', 'success');
            } catch (error) {
                console.error('Error loading prompt:', error);
                setStatus('Error loading prompt: ' + error.message, 'error');
            }
        }
        
        async function savePrompt() {
            const content = editor.getValue();
            setStatus('Saving prompt...', 'loading');
            
            try {
                const response = await fetch(`/api/v1/bot_hub/${botId}/nodes/${nodeId}/prompt`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        prompt: content
                    })
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const data = await response.json();
                originalContent = data.prompt;
                document.getElementById('saveBtn').disabled = true;
                
                setStatus('Prompt saved successfully', 'success');
            } catch (error) {
                console.error('Error saving prompt:', error);
                setStatus('Error saving prompt: ' + error.message, 'error');
            }
        }
        
        document.addEventListener('keydown', (e) => {
            if ((e.ctrlKey || e.metaKey) && e.key === 's') {
                e.preventDefault();
                if (!document.getElementById('saveBtn').disabled) {
                    savePrompt();
                }
            }
        });
        
        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
