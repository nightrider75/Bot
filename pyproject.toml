[project]
name = "bot"
version = "0.1.0"
description = ""
authors = [
    {name = "chethan"}
]
readme = "README.md"
requires-python = ">=3.10,<3.14"

dynamic = [ "dependencies" ]

[tool.poetry]
name = "bot"
version = "0.1.0"
description = ""
authors = ["chethan"]
packages = [{include = "bot", from = "src"}]

[tool.poetry.dependencies]
python = ">=3.10,<3.14"
flows-test = { path = "./deps/flows-test", develop = true }
bot-engine = { path = "./deps/bot-engine", extras = ["azure", "deepgram", "elevenlabs", "openai", "groq", "fireworks", "silero", "webrtc", "websocket", "runner", "google", "cartesia"], develop = true }
certifi = ">=2025.8.3,<2026.0.0"
requests = ">=2.32.5,<3.0.0"
twilio = ">=9.8.0,<10.0.0"
uuid = ">=1.30,<2.0"
nltk = ">=3.9.1,<4.0.0"
pydantic-settings = "^2.10.1"
alembic = "^1.16.5"
psycopg2-binary = "^2.9.10"
asyncpg = "^0.30.0"
greenlet = "^3.2.4"
aiofiles = "^24.1.0"
pydub = "^0.25.1"
aioboto3 = "^15.1.0"
azure-storage-blob = "^12.19.0"
plivo = "^4.59.2"
loguru = "^0.7.3"
aiocsv = "^1.4.0"
google-cloud-firestore = "^2.21.0"
google-cloud-pubsub = "^2.25.0"
indic-numtowords = "^1.1.0"
num2words = "^0.5.14"
aiohttp = "^3.10.0"
azure-identity = "^1.25.1"
google-cloud-storage = "^3.6.0"

[tool.poetry.scripts]
app = "bot.app:main"

[tool.poetry.group.dev.dependencies]
ruff = "^0.13.3"
python-dotenv = "^1.1.1"
pytest = "^8.3"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
exclude = [
    "alembic/env.py",
    "deps"
]
respect-gitignore = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
