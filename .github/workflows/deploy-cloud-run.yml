name: Deploy to Cloud Run

on:
  push:
    branches:
      - main

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  SERVICE_NAME: ${{ secrets.GCP_SERVICE_NAME }}
  REGION: ${{ secrets.GCP_REGION }}
  REPOSITORY: ${{ secrets.GCP_ARTIFACT_REGISTRY_REPO }}

jobs:
  deploy:
    # Use the production environment
    environment: production
    
    permissions:
      contents: read
      id-token: write
      # Required for private repos and submodules
      actions: read

    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.GH_PAT }}
          persist-credentials: true

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker to use gcloud as a credential helper
        run: |
          gcloud auth configure-docker $REGION-docker.pkg.dev --quiet

      - name: Build Docker image
        run: |
          IMAGE_TAG="$REGION-docker.pkg.dev/$PROJECT_ID/$REPOSITORY/$SERVICE_NAME:${{ github.sha }}"
          docker build -t $IMAGE_TAG .
          docker tag $IMAGE_TAG $REGION-docker.pkg.dev/$PROJECT_ID/$REPOSITORY/$SERVICE_NAME:latest

      - name: Push Docker image
        run: |
          IMAGE_TAG="$REGION-docker.pkg.dev/$PROJECT_ID/$REPOSITORY/$SERVICE_NAME:${{ github.sha }}"
          docker push $IMAGE_TAG
          docker push $REGION-docker.pkg.dev/$PROJECT_ID/$REPOSITORY/$SERVICE_NAME:latest

      - name: Deploy to Cloud Run  
        env:
          ENV_FILE_CONTENT: ${{ secrets.CLOUD_RUN_ENV_FILE }}
        run: |
          IMAGE_TAG="$REGION-docker.pkg.dev/$PROJECT_ID/$REPOSITORY/$SERVICE_NAME:${{ github.sha }}"
          
          # Create a temporary file with the ENV_FILE content
          printf '%s' "$ENV_FILE_CONTENT" > /tmp/env_content.txt
          
          # Read the file and create YAML with proper quoting
          python3 << 'PYEOF'
          import yaml
          import os
          
          # Read ENV_FILE content
          with open('/tmp/env_content.txt', 'r') as f:
              env_file_content = f.read()
          
          # Create env vars dictionary
          # Note: Cloud Run automatically sets PORT=8080 based on --port flag
          # We explicitly set it here to ensure consistency
          env_vars = {
              'PORT': '8080',
              'WORKERS': '1',
              'ENV_FILE': env_file_content
          }
          
          # Write properly formatted YAML
          with open('/tmp/env-vars.yaml', 'w') as f:
              yaml.dump(env_vars, f, default_flow_style=False, allow_unicode=True)
          PYEOF
          
          gcloud run deploy $SERVICE_NAME \
            --image $IMAGE_TAG \
            --region $REGION \
            --platform managed \
            --port 8080 \
            --timeout 300 \
            --memory 2Gi \
            --cpu 2 \
            --min-instances 0 \
            --max-instances 10 \
            --allow-unauthenticated \
            --env-vars-file /tmp/env-vars.yaml

      - name: Post Authenticate to Google Cloud
        if: success()
        run: |
          gcloud auth configure-docker $REGION-docker.pkg.dev --quiet

      - name: Post Checkout code
        if: success()
        run: |
          echo "Deployment successful!"
          SERVICE_URL=$(gcloud run services describe $SERVICE_NAME --region $REGION --format 'value(status.url)')
          echo "Service URL: $SERVICE_URL"
          echo "Testing health endpoint..."
          curl -f "$SERVICE_URL/health" || echo "Health check failed, but deployment completed"

      - name: Complete job
        if: success()
        run: |
          echo "Deployment completed successfully!"

